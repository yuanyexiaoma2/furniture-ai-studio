<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>盲测评分汇总</title><style>body{font:15px/1.7 "Microsoft YaHei",sans-serif;background:#f3f1eb;color:#272b28;margin:0}main{max-width:1250px;margin:auto;padding:40px 24px}article{background:#fffefa;border-radius:16px;padding:24px;margin:24px 0}small{color:#60685e}a{color:#365c43}.review-panel{background:#e8ede5;border:1px solid #c2cdbd;border-radius:16px;padding:24px;margin:24px 0}.review-help{font-size:13px;color:#56634f}button,.live-review-link{display:inline-block;padding:10px 16px;margin:10px 10px 10px 0;border:1px solid #45624b;border-radius:8px;background:#45624b;color:#fff;cursor:pointer;text-decoration:none}button:disabled,fieldset:disabled{opacity:.55;cursor:default}fieldset{border:0;padding:0;margin:0}.slot-rating{border-top:1px solid #d6dacf;margin-top:24px;padding-top:18px}.slot-rating legend{font-weight:bold}.rating-choices{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}.slot-rating input[name=reason]{box-sizing:border-box;display:block;width:100%;padding:10px;border:1px solid #c5cdbf;border-radius:6px;margin-top:6px;background:#fff}.round-link{margin-right:12px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:12px;border-bottom:1px solid #d7d9cf}.table-wrap{overflow-x:auto}</style><main><small>REVIEW / 盲测记录</small><h1>评分汇总 · 第一轮与第二轮</h1><p>三档数量按本轮每个图位最后一次保存的评分统计，未评分单独列出。每轮方案、样图和经验库数量均已冻结。</p><p><a href="http://localhost:3000/reviews/summary">打开实时汇总（需登录）</a></p><p>尚无评分轮次。请从产品评审页开始第一轮。</p></main></html>
